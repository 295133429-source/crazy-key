<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>疯狂水世界 · 分析器</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 16px;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0f1720; color: #e8eef5;
    min-height: 100vh;
  }
  h1 { font-size: 18px; margin: 0 0 4px; letter-spacing: 1px; }
  .sub { font-size: 12px; color: #7a8a9a; margin-bottom: 16px; }

  .scenario-bar {
    display: flex; align-items: center; gap: 8px;
    background: #161f29; border: 1px solid #24313d; border-radius: 12px;
    padding: 10px 12px; margin-bottom: 12px;
  }
  .scenario-bar label { font-size: 12px; color: #7a8a9a; white-space: nowrap; }
  .scenario-bar select { flex: 1; }

  .tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab {
    flex: 1; min-width: 70px; padding: 9px 4px; text-align: center; font-size: 12px;
    background: #1a2530; border-radius: 10px; cursor: pointer;
    border: 1px solid #24313d; transition: .15s;
  }
  .tab.active { background: #2a6df4; border-color: #2a6df4; color: #fff; font-weight: 600; }

  .panel { display: none; }
  .panel.active { display: block; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip {
    padding: 8px 14px; border-radius: 20px; font-size: 13px;
    background: #1a2530; border: 1px solid #24313d; cursor: pointer;
    transition: .15s; user-select: none;
  }
  .chip.active { background: #2a6df4; border-color: #2a6df4; color: #fff; font-weight: 600; }
  .chip.hero-chip.active { background: #e8590c; border-color: #e8590c; }

  .card {
    background: #161f29; border: 1px solid #24313d; border-radius: 14px;
    padding: 16px; margin-bottom: 12px;
  }
  .card h2 { font-size: 16px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .role-tag {
    font-size: 11px; font-weight: 400; padding: 2px 8px; border-radius: 10px;
    background: #24313d; color: #9ab;
  }
  .role-tag.dmg { background: #2a1a3a; color: #d8a8f0; }
  .role-tag.out { background: #1a2a3a; color: #9ac8e8; }

  .row { margin-bottom: 12px; }
  .row:last-child { margin-bottom: 0; }
  .label { font-size: 12px; color: #7a8a9a; margin-bottom: 6px; }
  .vals { display: flex; flex-wrap: wrap; gap: 6px; }
  .val {
    font-size: 13px; padding: 5px 10px; border-radius: 8px;
    background: #1e2a36; border: 1px solid #2a3a48;
  }
  .val.first { background: #1f3a2a; border-color: #2f6a45; color: #7ee2a8; font-weight: 600; }
  .val.second { background: #2a2a1f; border-color: #5a5a2f; color: #e2d47e; }
  .val.last { background: #1a2530; border-color: #2a3a48; color: #9ab; font-size: 12px; }

  .tip {
    font-size: 13px; line-height: 1.6; color: #b8c8d8;
    background: #1a2530; border-left: 3px solid #2a6df4;
    padding: 10px 12px; border-radius: 0 8px 8px 0; margin-top: 12px;
  }
  .tip.warn { border-left-color: #e2d47e; }
  .tip.suggest { border-left-color: #7ee2a8; }
  .tip.info { border-left-color: #9ac8e8; }

  .empty { text-align: center; color: #5a6a7a; font-size: 14px; padding: 40px 0; }

  .rank { font-size: 12px; color: #7a8a9a; margin: 12px 0 6px; }
  .hero-line {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; background: #1e2a36; border-radius: 10px;
    margin-bottom: 8px; border: 1px solid #2a3a48;
  }
  .hero-line.top { background: #1f3a2a; border-color: #2f6a45; }
  .hero-line .name { font-size: 14px; font-weight: 600; flex: 1; }
  .hero-line .reason { font-size: 12px; color: #9ab; }

  .form-block {
    background: #161f29; border: 1px solid #24313d; border-radius: 14px;
    padding: 14px; margin-bottom: 12px;
  }
  .form-block h3 { font-size: 14px; margin: 0 0 10px; color: #e8eef5; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; color: #7a8a9a; margin-bottom: 5px; }
  select, input[type=text], input[type=number], textarea {
    width: 100%; padding: 9px 10px; font-size: 13px;
    background: #1e2a36; border: 1px solid #2a3a48; border-radius: 8px;
    color: #e8eef5; outline: none; -webkit-appearance: none;
  }
  textarea {
    font-family: monospace; font-size: 11px; min-height: 120px;
    resize: vertical; word-break: break-all;
  }
  select:focus, input:focus, textarea:focus { border-color: #2a6df4; }

  .baseline-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .baseline-row .field { flex: 1; min-width: 90px; margin-bottom: 0; }

  .stat-picker { display: flex; flex-wrap: wrap; gap: 8px; }
  .stat-group { margin-bottom: 10px; }
  .stat-group-title {
    font-size: 12px; color: #7a8a9a; margin-bottom: 6px;
    border-left: 2px solid #2a6df4; padding-left: 6px;
  }
  .stat-item {
    display: flex; align-items: center; gap: 4px;
    background: #1e2a36; border: 1px solid #2a3a48; border-radius: 8px;
    padding: 4px 6px 4px 10px;
  }
  .stat-item.on { background: #2a6df4; border-color: #2a6df4; }
  .stat-item .stat-name {
    font-size: 12px; cursor: pointer; user-select: none;
    padding: 3px 2px; white-space: nowrap;
  }
  .stat-item.on .stat-name { color: #fff; font-weight: 600; }
  .stat-item input {
    width: 56px; padding: 3px 5px; font-size: 11px;
    background: #0f1720; border: 1px solid #2a3a48; border-radius: 5px;
    color: #e8eef5; outline: none; text-align: center;
  }
  .stat-item.on input { border-color: #fff; }
  .stat-item input::placeholder { color: #5a6a7a; }
  .stat-item .unit {
    font-size: 11px; color: #9ab; padding-right: 2px;
  }
  .stat-item.on .unit { color: #fff; }

  .btn {
    width: 100%; padding: 12px; font-size: 15px; font-weight: 600;
    background: #2a6df4; border: none; border-radius: 10px; color: #fff;
    cursor: pointer; margin-top: 4px;
  }
  .btn:active { background: #1a5ad4; }
  .btn.small { padding: 8px 14px; font-size: 13px; width: auto; }
  .btn.ghost { background: #24313d; }
  .btn.ghost:active { background: #2f3f4d; }
  .btn.danger { background: #6a2a2a; }
  .btn.danger:active { background: #7a3a3a; }
  .btn.cancel { background: #4a3a1a; }
  .btn.cancel:active { background: #5a4a2a; }
  .btn.export { background: #2a6a3a; }
  .btn.export:active { background: #1a5a2a; }
  .btn.import { background: #6a4a1a; }
  .btn.import:active { background: #7a5a2a; }
  .btn.swap { background: #2a4a6a; }
  .btn.swap:active { background: #1a3a5a; }

  .result-line {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 12px; border-radius: 10px; margin-bottom: 8px;
    background: #1e2a36; border: 1px solid #2a3a48; font-size: 13px;
  }
  .result-line.best { background: #1f3a2a; border-color: #2f6a45; }
  .result-line.tie { background: #2a2a1f; border-color: #5a5a2f; }
  .result-line .rname { font-weight: 600; flex: 1; min-width: 200px; }
  .result-line .rscore { color: #7ee2a8; font-weight: 600; }
  .verdict {
    font-size: 14px; line-height: 1.7; padding: 12px;
    border-radius: 10px; margin-top: 10px;
  }
  .verdict.swap { background: #1f3a2a; border: 1px solid #2f6a45; color: #a8e8c0; }
  .verdict.keep { background: #2a2a1f; border: 1px solid #5a5a2f; color: #e2d47e; }
  .verdict.other { background: #1f2a3a; border: 1px solid #2f4a6a; color: #9ac8e8; }

  .analysis {
    background: #0f1720; border: 1px solid #2a6df4;
    border-radius: 10px; padding: 12px; margin-top: 12px;
  }
  .analysis h4 {
    font-size: 14px; margin: 0 0 10px; color: #7ee2a8;
    border-bottom: 1px solid #2a3a48; padding-bottom: 6px;
  }
  .analysis .line {
    font-size: 13px; line-height: 1.7; margin-bottom: 6px;
    padding-left: 10px; border-left: 2px solid #2a3a48;
  }
  .analysis .line.good { border-left-color: #7ee2a8; }
  .analysis .line.bad { border-left-color: #e87a7a; }
  .analysis .line.warn { border-left-color: #e2d47e; }
  .analysis .line.info { border-left-color: #9ac8e8; }
  .analysis .good { color: #7ee2a8; font-weight: 600; }
  .analysis .bad { color: #f0c88a; font-weight: 600; }
  .analysis .conclusion {
    font-size: 14px; padding: 10px; border-radius: 8px;
    margin-top: 10px; font-weight: 600;
  }
  .analysis .conclusion.swap { background: #1f3a2a; color: #a8e8c0; }
  .analysis .conclusion.keep { background: #2a2a1f; color: #e2d47e; }
  .analysis .conclusion.tie { background: #1f2a3a; color: #9ac8e8; }

  .slot {
    background: #1e2a36; border: 1px solid #2a3a48; border-radius: 10px;
    padding: 10px 12px; margin-bottom: 8px; font-size: 13px;
    scroll-margin-top: 16px;
  }
  .slot.editing { border-color: #2a6df4; background: #1f2a3a; }
  .slot.just-replaced {
    border-color: #7ee2a8;
    box-shadow: 0 0 0 2px #7ee2a8;
    animation: pulse 1.2s ease-in-out 2;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 2px #7ee2a8; }
    50% { box-shadow: 0 0 0 6px rgba(126,226,168,0.3); }
  }
  .slot .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .slot .tag { font-size: 11px; padding: 2px 8px; border-radius: 8px; background: #24313d; color: #9ab; }
  .slot .stats { display: flex; flex-wrap: wrap; gap: 5px; }
  .slot .stats span {
    font-size: 12px; padding: 3px 8px; border-radius: 6px;
    background: #0f1720; border: 1px solid #2a3a48;
  }
  .slot .empty-tip { color: #5a6a7a; font-size: 13px; }
  .slot-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .editing-hint {
    font-size: 12px; color: #7ee2a8; margin-bottom: 6px;
    padding: 6px 8px; background: #1f3a2a; border-radius: 6px;
  }
  .inline-edit {
    margin-top: 10px; padding: 10px;
    background: #0f1720; border-radius: 8px;
    border: 1px solid #2a6df4;
  }
  .inline-edit .field { margin-bottom: 8px; }
  .inline-edit .actions { display: flex; gap: 6px; margin-top: 8px; }

  .q-badge {
    display: inline-block; font-size: 11px; font-weight: 600;
    padding: 2px 7px; border-radius: 6px; margin-right: 4px;
    vertical-align: middle;
  }
  .q-purple { background: #3a2a5a; color: #c8a8f0; border: 1px solid #5a3a8a; }
  .q-orange { background: #5a3a1a; color: #f0c88a; border: 1px solid #8a5a2a; }
  .q-red    { background: #5a1a1a; color: #f0a8a8; border: 1px solid #8a2a2a; }

  .base-line {
    font-size: 12px; color: #9ab; margin-top: 4px;
    padding: 4px 8px; background: #0f1720; border-radius: 6px;
    display: inline-block;
  }

  .slot-swap-row {
    display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px;
  }

  .overview-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .conflict-line {
    font-size: 13px; line-height: 1.7; padding: 8px 10px;
    background: #1e2a36; border-radius: 8px; margin-bottom: 6px;
    border-left: 3px solid #2a6df4;
  }
  .conflict-line.warn { border-left-color: #e2d47e; }
  .conflict-line.good { border-left-color: #7ee2a8; }
  .conflict-line.info { border-left-color: #9ac8e8; }
  .conflict-line.bad  { border-left-color: #e87a7a; }
  .tier {
    display: inline-block; font-size: 11px; font-weight: 600;
    padding: 2px 7px; border-radius: 6px; margin-right: 4px;
  }
  .tier.t0 { background: #1f3a2a; color: #7ee2a8; border: 1px solid #2f6a45; }
  .tier.t1 { background: #2a2a1f; color: #e2d47e; border: 1px solid #5a5a2f; }
  .tier.t2 { background: #1a2a3a; color: #9ac8e8; border: 1px solid #2f4a6a; }
  .tier.t3 { background: #24313d; color: #9ab; border: 1px solid #2a3a48; }
  .tier.tn { background: #2a1a1a; color: #f0a8a8; border: 1px solid #6a2a2a; }

  .stat-def-box {
    background: #0f1720; border-left: 3px solid #9ac8e8;
    padding: 8px 10px; border-radius: 0 8px 8px 0;
    font-size: 12px; line-height: 1.6; color: #b8c8d8;
    margin-top: 6px;
  }
  .stat-def-box b { color: #e8eef5; }

  .replace-card {
    background: #1e2a36; border: 1px solid #2a3a48; border-radius: 10px;
    padding: 12px; margin-bottom: 10px;
  }
  .replace-card.priority {
    border-color: #e2d47e;
    background: #2a2a1f;
  }
  .replace-card .rc-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
  }
  .replace-card .rc-title { font-size: 14px; font-weight: 600; }
  .replace-card .rc-score { font-size: 12px; color: #9ab; }
  .replace-card .rc-body { font-size: 13px; line-height: 1.7; color: #b8c8d8; }
  .replace-card .rc-body b { color: #e8eef5; }
  .replace-card .rc-tag {
    display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 6px;
    background: #24313d; color: #9ab; margin-right: 4px;
  }

  .candidate {
    background: #1e2a36; border: 1px solid #2a3a48; border-radius: 10px;
    padding: 12px; margin-bottom: 10px;
  }
  .candidate.active {
    border-color: #e2d47e;
    background: #2a2a1f;
  }
  .candidate .c-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px; flex-wrap: wrap; gap: 6px;
  }
  .candidate .c-title { font-size: 14px; font-weight: 600; }
  .candidate .c-score { font-size: 12px; color: #9ab; }
  .candidate .c-body { font-size: 13px; line-height: 1.7; color: #b8c8d8; }
  .candidate .c-rec {
    background: #1a2530; border-left: 3px solid #9ac8e8;
    padding: 6px 10px; border-radius: 0 6px 6px 0;
    font-size: 12px; color: #b8c8d8; margin: 8px 0;
  }
  .candidate .c-slot-row {
    display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px;
  }
  .candidate .c-slot-btn {
    padding: 5px 10px; font-size: 12px;
    background: #24313d; border: 1px solid #2a3a48; border-radius: 6px;
    color: #e8eef5; cursor: pointer;
  }
  .candidate .c-slot-btn:hover { background: #2f3f4d; }
  .candidate .c-slot-btn.rec {
    background: #2a4a6a; border-color: #4a6a8a;
  }
  .candidate .c-slot-btn.selected {
    background: #2a6df4; border-color: #2a6df4; color: #fff; font-weight: 600;
  }

  /* 资源规划 */
  .resource-row {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 12px; border-radius: 10px; margin-bottom: 8px;
    background: #1e2a36; border: 1px solid #2a3a48; font-size: 13px;
  }
  .resource-row.top1 {
    border-color: #7ee2a8;
    background: #1f3a2a;
  }
  .resource-row.dim {
    opacity: 0.65;
  }
  .resource-row .r-rank {
    font-size: 12px; font-weight: 700;
    min-width: 24px; text-align: center;
    padding: 3px 6px; border-radius: 6px;
    background: #24313d; color: #9ab;
  }
  .resource-row.top1 .r-rank { background: #2f6a45; color: #a8e8c0; }
  .resource-row .r-name { flex: 1; min-width: 200px; font-weight: 600; }
  .resource-row .r-gain {
    font-size: 13px; font-weight: 600;
  }
  .resource-row .r-tag {
    font-size: 11px; padding: 2px 7px; border-radius: 6px;
  }
</style>
</head>
<body>

<h1>疯狂水世界 · 分析器</h1>
<div class="sub">场景化评分 · 候选池对比 · 资源规划</div>

<div class="scenario-bar">
  <label>场景：</label>
  <select id="scenarioSelect" onchange="onScenarioChange()">
    <option value="通用">通用（默认）</option>
    <option value="PVP竞技场">PVP 竞技场</option>
    <option value="世界BOSS">世界 BOSS / 深渊</option>
    <option value="深渊爬塔">深渊爬塔</option>
    <option value="海域探索">海域探索</option>
    <option value="主线推图">主线推图</option>
  </select>
</div>
<div style="margin-bottom: 16px; text-align: center;">
  <<script>
  atOptions = {
    'key' : '93e0c61ce6ac1e082cbfc1bbc259d4fb',
    'format' : 'iframe',
    'height' : 50,
    'width' : 320,
    'params' : {}
  };
</script>
<script src="https://www.highrevenueformat.com/93e0c61ce6ac1e082cbfc1bbc259d4fb/invoke.js"></script>>
</div>
<div class="tabs">
  <div class="tab active" data-panel="byHero">按英雄查</div>
  <div class="tab" data-panel="byStat">按词条反查</div>
  <div class="tab" data-panel="myBag">配置和对比</div>
  <div class="tab" data-panel="team">阵容玩法</div>
  <div class="tab" data-panel="backup">备份</div>
</div>

<div class="panel active" id="byHero">
  <div class="chips" id="heroChips"></div>
  <div id="heroResult"><div class="empty">点一个英雄查看优先级</div></div>
</div>

<div class="panel" id="byStat">
  <div class="chips" id="statChips"></div>
  <div id="statResult"><div class="empty">点一个词条查看最适合给谁</div></div>
</div>

<div class="panel" id="myBag">
  <div class="chips" id="bagHeroChips"></div>
  <div id="bagResult"></div>
</div>

<div class="panel" id="team">
  <div class="form-block">
    <h3>玩法模式</h3>
    <div class="field">
      <select id="teamMode">
        <option value="preset">主流阵容模板</option>
        <option value="free">自由选择英雄</option>
      </select>
    </div>
  </div>

  <div id="presetMode">
    <div class="form-block">
      <h3>选择一套主流阵容</h3>
      <div class="field">
        <select id="presetTeam"></select>
      </div>
    </div>
    <div id="presetResult"></div>
  </div>

  <div id="freeMode" style="display:none">
    <div class="form-block">
      <h3>选择 5 个英雄</h3>
      <div class="chips" id="freeHeroChips"></div>
    </div>
    <div id="freeResult"></div>
  </div>
</div>

<div class="panel" id="backup">
  <div class="form-block">
    <h3>导出配置</h3>
    <div class="field">
      <label>点下面按钮生成备份文字，复制存到微信/备忘录/电脑</label>
      <button class="btn export" onclick="doExport()">生成备份文字</button>
    </div>
    <div class="field">
      <label>备份文字（可全选复制）</label>
      <textarea id="exportArea" placeholder="点上面按钮生成..." readonly></textarea>
    </div>
    <button class="btn ghost" onclick="copyExport()">复制备份文字</button>
  </div>

  <div class="form-block">
    <h3>导入配置</h3>
    <div class="field">
      <label>把备份文字粘贴到这里</label>
      <textarea id="importArea" placeholder="粘贴备份文字..."></textarea>
    </div>
    <button class="btn import" onclick="doImport()">导入并覆盖当前数据</button>
    <div class="tip warn">⚠️ 导入会覆盖当前手机上的所有配置数据。建议先导出备份，再导入。</div>
  </div>
</div>

<script>
/* ============================================================
   规则区
   ============================================================ */

const MAX_BADGES = 4;
const MAX_GEARS = 3;

const FLAT_STATS = ['护甲', '护甲穿透', '抗性', '抗性穿透'];
const DILUTABLE_STATS = ['伤害增加'];

const STAT_THRESHOLDS = {

function statBase(index) {
  if (index === 0) return 10;
  if (index === 1) return 7;
  if (index === 2) return 4;
  return 2;
}

function statTypeMultiplier(hero, statName) {
  if (!hero) return 1;
  const dmg = hero.damageType;
  const out = hero.outputType;

  if (statName === '护甲穿透' && dmg === '能量') return 0.3;
  if (statName === '抗性穿透' && dmg === '物理') return 0.3;
  if (statName === '攻击' && out === '技能') return 0.6;
  if (statName === '技能强度' && out === '普攻') return 0.5;
  if (statName === '攻击速度' && out === '技能') return 0.4;
  if ((statName === '命中' || statName === '生命回收') && out === '技能') return 0.7;

  return 1;
}

function scoreStats(heroName, stats, quality, part, itemType) {
  const h = HEROES[heroName];
  if (!h) return 0;
  const list = itemType === 'badge' ? h.badge : h.gear;
  let score = 0;
  let partPenalty = 1;
  if (itemType === 'gear' && part) {
    partPenalty = h.parts.includes(part) ? 1 : 0.5;
  }
  stats.forEach(item => {
    const name = ALIAS_MAP[item.name] || item.name;
    const idx = list.indexOf(name);
    if (idx >= 0) {
      const v = item.pct || 1;
      let s = statBase(idx) * (v / 100) * quality * partPenalty;
      s *= statTypeMultiplier(h, name);
      s *= getScenarioMultiplier(name);
      score += s;
    }
  });
  return score;
}

function scoreBadgeBase(heroName, base) {
  const h = HEROES[heroName];
  if (!h) return 0;
  const w = h.baseWeight;
  const hp = base.hp || 0;
  const atk = base.atk || 0;
  const skill = base.skill || 0;
  return hp * w.hp + atk * w.atk + skill * w.skill;
}

function scoreGearBase(heroName, part, base) {
  const fields = GEAR_FIXED_FIELDS[part] || [];
  const weights = GEAR_BASE_WEIGHT[part] || {};
  let score = 0;
  fields.forEach(f => {
    const v = base[f] || 0;
    const w = weights[f] || 1;
    score += v * w;
  });
  if (base.pierceType && base.pierceValue) {
    score += (base.pierceValue / 100) * 2;
  }
  return score;
}

function scoreBase(heroName, itemType, part, base) {
  if (itemType === 'badge') return scoreBadgeBase(heroName, base || { hp:0, atk:0, skill:0 });
  return scoreGearBase(heroName, part, base || {});
}

function scoreItem(heroName, stats, quality, part, itemType, base) {
  return scoreStats(heroName, stats, quality, part, itemType) + scoreBase(heroName, itemType, part, base);
}

function normalizeStats(stats) {
  return (stats || []).map(s => {
    if (typeof s === 'string') {
      return { name: ALIAS_MAP[s] || s, pct: 1 };
    }
    return { name: ALIAS_MAP[s.name] || s.name, pct: s.pct || 1 };
  });
}

function normalizeItem(item) {
  const out = { quality: item.quality, stats: normalizeStats(item.stats) };
  if (item.part) out.part = item.part;
  out.base = item.base || { hp: 0, atk: 0, skill: 0 };
  return out;
}

function arrayToSlots(arr, max) {
  const slots = {};
  (arr || []).slice(0, max).forEach((item, i) => {
    slots[String(i + 1)] = item;
  });
  return slots;
}

function loadConfig() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Object.keys(parsed).length > 0) return parsed;
    }
  } catch(e) {}

  let merged = {};
  LEGACY_KEYS.forEach(key => {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return;
      const old = JSON.parse(raw);
      Object.keys(old).forEach(hero => {
        if (!merged[hero]) merged[hero] = { badges: {}, gears: {} };
        const v = old[hero];
        if (Array.isArray(v.badges)) {
          merged[hero].badges = Object.assign(merged[hero].badges, arrayToSlots(v.badges.map(normalizeItem), MAX_BADGES));
        } else if (v.badge) {
          merged[hero].badges['1'] = normalizeItem(v.badge);
        }
        if (Array.isArray(v.gears)) {
          merged[hero].gears = Object.assign(merged[hero].gears, arrayToSlots(v.gears.map(normalizeItem), MAX_GEARS));
        } else if (v.gear) {
          merged[hero].gears['1'] = normalizeItem(v.gear);
        }
      });
    } catch(e) {}
  });

  if (Object.keys(merged).length > 0) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
    return merged;
  }

  if (Object.keys(DEFAULT_DATA).length > 0) {
    const copy = JSON.parse(JSON.stringify(DEFAULT_DATA));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(copy));
    return copy;
  }

  return {};
}

function statTier(heroName, statName) {
  const h = HEROES[heroName];
  const badgeIdx = h.badge.indexOf(statName);
  const gearIdx = h.gear.indexOf(statName);
  const best = Math.min(
    badgeIdx >= 0 ? badgeIdx : 99,
    gearIdx >= 0 ? gearIdx : 99
  );
  if (best === 0) return { cls: 't0', label: 'T0 核心', desc: '该英雄第 1 优先级' };
  if (best === 1) return { cls: 't1', label: 'T1 次核心', desc: '该英雄第 2 优先级' };
  if (best === 2) return { cls: 't2', label: 'T2 可用', desc: '该英雄第 3 优先级' };
  if (best >= 3 && best < 99) return { cls: 't3', label: 'T3 过渡', desc: '在推荐列表里，但排名靠后' };
  return { cls: 'tn', label: '不推荐', desc: '不在该英雄推荐列表里' };
}

function renderStat(stat) {
  const s = STATS[stat];
  let html = `<div class="card">
    <h2>「${stat}」给谁最合适</h2>`;

  if (STAT_DEFS[stat]) {
    html += `<div class="stat-def-box"><b>官方说明：</b>${STAT_DEFS[stat]}</div>`;
  }
  if (isDilutable(stat)) {
    html += `<div class="tip warn">ℹ️ 这是通用增伤词条，对物理和能量伤害都生效，收益稳定但容易被其他增伤渠道稀释。不是虚战，但优先级低于攻击和穿透。</div>`;
  }
  if (STAT_THRESHOLDS[stat]) {
    const t = STAT_THRESHOLDS[stat];
    html += `<div class="tip info">📊 阈值：${t.note}。装备+徽章累计达到 ${t.cap}% 就是上限，达到 ${t.warn}% 左右就要注意边际收益。</div>`;
  }

  html += `<div class="rank">首选英雄 + 收益档位</div>`;
  s.top.forEach(n => {
    if (!HEROES[n]) return;
    const t = statTier(n, stat);
    const h = HEROES[n];
    html += `<div class="hero-line top">
      <span class="name">${n}</span>
      <span class="tier ${t.cls}">${t.label}</span>
      <span class="reason">${t.desc} · ${h.damageType}${h.outputType}</span>
    </div>`;
  });

  if (s.second.length) {
    html += `<div class="rank">次选英雄 + 收益档位</div>`;
    s.second.forEach(n => {
      if (!HEROES[n]) return;
      const t = statTier(n, stat);
      const h = HEROES[n];
      html += `<div class="hero-line">
        <span class="name">${n}</span>
        <span class="tier ${t.cls}">${t.label}</span>
        <span class="reason">${t.desc} · ${h.damageType}${h.outputType}</span>
      </div>`;
    });
  }

  const notRecommended = Object.keys(HEROES).filter(n => {
    const h = HEROES[n];
    if (h.badge.indexOf(stat) >= 0 || h.gear.indexOf(stat) >= 0) return false;
    if (stat === '护甲穿透' && h.damageType === '能量') return true;
    if (stat === '抗性穿透' && h.damageType === '物理') return true;
    if (stat === '攻击' && h.outputType === '技能') return true;
    if (stat === '技能强度' && h.outputType === '普攻') return true;
    if (stat === '攻击速度' && h.outputType === '技能') return true;
    return false;
  });
  if (notRecommended.length > 0) {
    html += `<div class="rank">这些英雄吃不到 / 收益极低</div>
      <div class="tip warn">${notRecommended.join('、')}：${stat} 对他们收益很低，优先别占核心槽。</div>`;
  }

  html += `<div class="tip info">${s.reason}</div></div>`;
  statResultEl.innerHTML = html;
}

  }
}

/* ============ 资源规划 ============ */

function renderResourcePlan(name) {
  const data = getHeroData(name);
  const h = HEROES[name];

  /* 收集所有候选的"如果换到推荐槽位"的提升幅度 */
  const heroCandidates = CANDIDATES.filter(c => c.hero === name);
  if (heroCandidates.length === 0) {
    return `<div class="form-block" style="margin-top:12px">
      <h3>资源规划</h3>
      <div class="tip info">候选池是空的。先去下面「新物品候选池」录入候选，这里会自动帮你排出"先换哪件、后换哪件"。</div>
    </div>`;
  }

  const planItems = [];

  heroCandidates.forEach(cand => {
    const isGear = cand.type === 'gear';
    const slots = isGear ? data.gears : data.badges;
    const max = isGear ? MAX_GEARS : MAX_BADGES;

    let bestSlot = null;
    let bestGap = -Infinity;
    for (let i = 1; i <= max; i++) {
      const key = String(i);
      if (!slots[key]) continue;
      if (isGear && slots[key].part !== cand.part) continue;
      const oldItem = slots[key];
      const newScore = scoreItem(name, cand.stats, cand.quality, isGear ? cand.part : null, isGear ? 'gear' : 'badge', cand.base);
      const oldScore = scoreItem(name, oldItem.stats, oldItem.quality, oldItem.part, isGear ? 'gear' : 'badge', oldItem.base);
      const gap = newScore - oldScore;
      if (gap > bestGap) {
        bestGap = gap;
        bestSlot = key;
      }
    }

    if (bestSlot) {
      planItems.push({
        cand: cand,
        slot: bestSlot,
        gain: bestGap,
        isGear: isGear
      });
    }
  });

  if (planItems.length === 0) {
    return `<div class="form-block" style="margin-top:12px">
      <h3>资源规划</h3>
      <div class="tip warn">候选池里的物品都没有可对比的同部位槽位，无法计算提升幅度。</div>
    </div>`;
  }

  /* 按提升幅度排序 */
  planItems.sort((a, b) => b.gain - a.gain);

  let html = `<div class="form-block" style="margin-top:12px">
    <h3>资源规划（资源有限时先升哪个）</h3>
    <div class="tip info">按"如果换上，相对当前槽位的提升幅度"从大到小排序。</div>`;

  planItems.forEach((item, idx) => {
    const cand = item.cand;
    const isGear = item.isGear;
    const title = isGear
      ? `${cand.part} · ${cand.stats.map(statLabel).join(' + ')}`
      : `徽章 · ${cand.stats.map(statLabel).join(' + ')}`;

    let tagHtml = '';
    let rowCls = '';
    if (idx === 0 && item.gain > 0) {
      tagHtml = `<span class="r-tag" style="background:#2f6a45;color:#a8e8c0">优先升</span>`;
      rowCls = 'top1';
    } else if (item.gain > 0.5) {
      tagHtml = `<span class="r-tag" style="background:#2a4a6a;color:#9ac8e8">值得升</span>`;
    } else if (item.gain > 0) {
      tagHtml = `<span class="r-tag" style="background:#24313d;color:#9ab">可升可不升</span>`;
      rowCls = 'dim';
    } else {
      tagHtml = `<span class="r-tag" style="background:#2a1a1a;color:#f0a8a8">先别升</span>`;
      rowCls = 'dim';
    }

    html += `<div class="resource-row ${rowCls}">
      <span class="r-rank">${idx + 1}</span>
      <span class="r-name">${title}</span>
      <span class="r-gain" style="color:${item.gain > 0 ? '#7ee2a8' : '#e87a7a'}">
        ${item.gain >= 0 ? '+' : ''}${item.gain.toFixed(2)} 分
      </span>
      ${tagHtml}
    </div>
    <div style="font-size:12px;color:#7a8a9a;margin:-4px 0 10px 34px">
      → 换到 ${isGear ? '装备' : '徽章'} 槽 ${item.slot}（${isGear ? cand.part : ''}）
    </div>`;
  });

  /* 总结 */
  const top1 = planItems[0];
  if (top1.gain > 0) {
    let summary = `建议优先升 <b>${top1.isGear ? top1.cand.part : '徽章'} · ${top1.cand.stats.map(statLabel).join(' + ')}</b>，换到槽 ${top1.slot}，提升 ${top1.gain.toFixed(2)} 分。`;
    if (planItems.length > 1 && planItems[1].gain > 0) {
      summary += ` 其次是「${planItems[1].isGear ? planItems[1].cand.part : '徽章'} · ${planItems[1].cand.stats.map(statLabel).join(' + ')}」（+${planItems[1].gain.toFixed(2)} 分）。`;
    }
    if (planItems.some(p => p.gain <= 0)) {
      summary += ` 提升幅度为负或接近零的候选，先放着，别浪费资源。`;
    }
    html += `<div class="tip suggest" style="margin-top:12px">${summary}</div>`;
  } else {
    html += `<div class="tip warn" style="margin-top:12px">当前候选池里没有一件比现有配置更好的。建议继续攒资源，等更好的再换。</div>`;
  }

  html += `</div>`;
  return html;
}

    slotList.forEach(k => {
      const oldItem = slots[k];
      const oldScore = scoreItem(name, oldItem.stats, oldItem.quality, oldItem.part, isGear ? 'gear' : 'badge', oldItem.base);
      const gap = sc - oldScore;

    </div>`;

    html += `</div>`;
  });

  listWrap.innerHTML = html;
}

function buildCandidateCompare(name, cand, oldItem, oldSlot) {
  const isGear = cand.type === 'gear';
  const itemType = isGear ? 'gear' : 'badge';
  const newPart = isGear ? cand.part : null;

  const newScore = scoreItem(name, cand.stats, cand.quality, newPart, itemType, cand.base);
  const oldScore = scoreItem(name, oldItem.stats, oldItem.quality, oldItem.part, itemType, oldItem.base);
  const gain = newScore - oldScore;

  const analysis = buildFlexibleAnalysis(name, itemType, cand.stats, cand.quality, newPart, cand.base, oldItem, oldSlot);

  let html = `<div class="analysis" style="margin-top:12px">
    <h4>📋 对比：候选 vs 槽 ${oldSlot}</h4>

    <div class="rank">候选</div>
    <div class="result-line best">
      <span class="rname">${isGear ? cand.part + ' · ' : ''}${qualityBadge(cand.quality)}${qualityName(cand.quality)} · ${cand.stats.map(statLabel).join(' + ')}</span>
      <span class="rscore">${newScore.toFixed(2)} 分</span>
    </div>
    ${baseLine(itemType, newPart, cand.base)}

    <div class="rank">当前槽 ${oldSlot}</div>
    <div class="result-line">
      <span class="rname">${isGear ? oldItem.part + ' · ' : ''}${qualityBadge(oldItem.quality)}${qualityName(oldItem.quality)} · ${oldItem.stats.map(statLabel).join(' + ')}</span>
      <span class="rscore" style="color:#9ab">${oldScore.toFixed(2)} 分</span>
    </div>
    ${baseLine(itemType, oldItem.part, oldItem.base)}

    <div class="rank">分差</div>
    <div class="result-line ${gain > 0 ? 'best' : (gain < 0 ? 'tie' : '')}">
      <span class="rname">候选 - 槽 ${oldSlot}</span>
      <span style="color:${gain > 0 ? '#7ee2a8' : (gain < 0 ? '#e87a7a' : '#9ab')};font-weight:600">${gain >= 0 ? '+' : ''}${gain.toFixed(2)} 分</span>
    </div>
    `;

  analysis.lines.forEach(l => {
    html += `<div class="line ${l.cls}">${l.text}</div>`;
  });
  html += `<div class="conclusion ${analysis.verdictClass}">${analysis.verdict}</div>`;

  html += `<div class="slot-swap-row" style="margin-top:12px">
    <button class="btn swap small" onclick="applyCandidate('${name}','${cand.id}','${oldSlot}')">换到槽 ${oldSlot}</button>
    <button class="btn cancel small" onclick="clearCandidateTarget('${name}','${cand.id}')">取消对比</button>
  </div>`;

  html += `</div>`;
  return html;
}

function openCandidatePanel(hero) {
  candidatePanel.open = true;
  candidatePanel.type = 'badge';
  candidatePanel.part = '防具';
  renderBag(hero);
}

function closeCandidatePanel(hero) {

}

function onCandidateTypeChange(hero) {

  renderBag(hero);
}

function onCandidatePartChange(hero) {
  candidatePanel.part = document.getElementById('candPart').value;
  renderBag(hero);
}

function saveCandidate(hero) {
  const type = candidatePanel.type;
  const isGear = type === 'gear';
  const part = isGear ? candidatePanel.part : null;
  const q = parseFloat(document.getElementById('candQ').value);
  const base = readBaseFields(isGear ? 'gear' : 'badge', part, 'candBase');
  const stats = getSelected(document.getElementById('candStats'));

  if (stats.length === 0) { alert('请至少选一个词条'); return; }

  const cand = {
    id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
    hero: hero,
    type: type,
    part: part,
    quality: q,
    base: base,
    stats: stats
  };
  CANDIDATES.push(cand);
  saveCandidates(CANDIDATES);
  candidatePanel.open = false;
  renderBag(hero);
}

function removeCandidate(hero, id) {
  if (!confirm('删除这个候选？')) return;
  CANDIDATES = CANDIDATES.filter(c => c.id !== id);
  delete candidateTargets[id];
  saveCandidates(CANDIDATES);
  renderBag(hero);
}

function selectCandidateTarget(hero, id, slotKey) {
  if (candidateTargets[id] === slotKey) {
    delete candidateTargets[id];
  } else {
    candidateTargets[id] = slotKey;
  }
  renderBag(hero);
  setTimeout(() => {
    const cands = document.querySelectorAll('.candidate');
    cands.forEach(c => {
      if (c.innerHTML.indexOf('对比：候选') >= 0) {
        c.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    });
  }, 100);
}

function clearCandidateTarget(hero, id) {
  delete candidateTargets[id];
  renderBag(hero);
}

function applyCandidate(hero, id, slotKey) {
  const cand = CANDIDATES.find(c => c.id === id);
  if (!cand) { alert('候选不存在'); return; }

  const isGear = cand.type === 'gear';
  const data = getHeroData(hero);

  if (isGear) {
    data.gears[slotKey] = {
      part: cand.part,
      quality: cand.quality,
      stats: cand.stats,
      base: cand.base
    };
  } else {
    data.badges[slotKey] = {
      quality: cand.quality,
      stats: cand.stats,
      base: cand.base
    };
  }
  saveConfig(CONFIG);

  CANDIDATES = CANDIDATES.filter(c => c.id !== id);
  delete candidateTargets[id];
  saveCandidates(CANDIDATES);

  justReplaced = { hero: hero, type: isGear ? 'gear' : 'badge', slot: slotKey };
  renderBag(hero);

  setTimeout(() => {
    const slotId = 'slot-' + (isGear ? 'gear' : 'badge') + '-' + slotKey;
    const el = document.getElementById(slotId);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 100);
}

/* ============ 整体短板 & 阈值溢出 ============ */

function collectOwnedStats(name) {
  const data = getHeroData(name);
  const owned = { badge: new Set(), gear: new Set() };
  Object.values(data.badges).forEach(b => b.stats.forEach(s => owned.badge.add(s.name)));
  Object.values(data.gears).forEach(g => g.stats.forEach(s => owned.gear.add(s.name)));
  return owned;
}

function calcStatTotals(name) {
  const data = getHeroData(name);
  const totals = {};
  Object.values(data.badges).forEach(b => {
    b.stats.forEach(s => {
      const n = ALIAS_MAP[s.name] || s.name;
      totals[n] = (totals[n] || 0) + (s.pct || 0);
    });
  });
  Object.values(data.gears).forEach(g => {
    g.stats.forEach(s => {
      const n = ALIAS_MAP[s.name] || s.name;
      totals[n] = (totals[n] || 0) + (s.pct || 0);
    });
  });
  return totals;
}

function calcThresholdChecks(name) {
  const totals = calcStatTotals(name);
  const out = [];
  Object.keys(STAT_THRESHOLDS).forEach(statName => {
    const t = STAT_THRESHOLDS[statName];
    const v = totals[statName] || 0;
    if (v <= 0) return;
    let cls, note;
    if (v >= t.cap) {
      cls = 'warn';
      note = `装备+徽章累计 ${v.toFixed(2)}%，已达/超过 ${t.cap}% 阈值。${t.note}。再堆该词条收益会大幅下降。`;
    } else if (v >= t.warn) {
      cls = 'info';
      note = `装备+徽章累计 ${v.toFixed(2)}%，接近 ${t.cap}% 阈值。${t.note}。再多堆就要留意收益。`;
    } else {
      cls = 'good';
      note = `装备+徽章累计 ${v.toFixed(2)}%，离 ${t.cap}% 阈值还有空间。`;
    }
    out.push({ stat: statName, cls, note });
  });
  return out;
}

function renderOverview(name) {
  const box = document.getElementById('overviewBox');
  if (!box) return;
  const h = HEROES[name];
  const data = getHeroData(name);
  const owned = collectOwnedStats(name);

  const badgeCount = Object.keys(data.badges).length;
  const gearCount = Object.keys(data.gears).length;

  const allOwned = new Set([...owned.badge, ...owned.gear]);

  const coreBadge = h.badge.slice(0, 3);
  const coreGear = h.gear.slice(0, 3);
  const coreAll = [...new Set([...coreBadge, ...coreGear])];

  const coreMissing = coreAll.filter(s => !allOwned.has(s));
  const dilutableOwned = [...allOwned].filter(s => isDilutable(s));

  const attackStats = ['攻击', '技能强度', '攻击速度', '暴击', '暴击伤害', '护甲穿透', '抗性穿透', '命中'];
  const surviveStats = ['生命', '伤害减免', '护甲', '抗性', '暴击抵抗', '闪避', '生命恢复', '控制抗性'];
  const funcStats = ['冷却缩减', '初始能量', '生命回收'];

  const attackCount = [...allOwned].filter(s => attackStats.includes(s)).length;
  const surviveCount = [...allOwned].filter(s => surviveStats.includes(s)).length;
  const funcCount = [...allOwned].filter(s => funcStats.includes(s)).length;

  let lines = [];

  lines.push({
    cls: badgeCount >= MAX_BADGES && gearCount >= MAX_GEARS ? 'good' : 'warn',
    text: `槽位：徽章 ${badgeCount}/${MAX_BADGES}，装备 ${gearCount}/${MAX_GEARS}。${badgeCount >= MAX_BADGES && gearCount >= MAX_GEARS ? '已满，进入词条精修阶段。' : '还没满，优先补空槽。'}`
  });

  if (coreMissing.length === 0) {
    lines.push({ cls: 'good', text: `核心词条：前 3 优先级已覆盖（${coreAll.join('、')}）。` });
  } else {
    lines.push({ cls: 'warn', text: `核心词条缺口：还缺 ${coreMissing.join('、')}。这是${name}最吃收益的方向，优先补。` });
  }

  lines.push({
    cls: 'info',
    text: `词条结构：输出类 ${attackCount} 条，生存类 ${surviveCount} 条，功能类 ${funcCount} 条。`
  });

  if (h.role === '坦克') {
    if (surviveCount < 3) {
      lines.push({ cls: 'bad', text: `作为坦克，生存类词条只有 ${surviveCount} 条，偏少。建议至少 3 条以上生存词条。` });
    } else {
      lines.push({ cls: 'good', text: `作为坦克，生存类词条 ${surviveCount} 条，结构合理。` });
    }
  } else if (h.role === '战士' || h.role === '射手' || h.role === '法师') {
    if (attackCount < 2) {
      lines.push({ cls: 'bad', text: `作为${h.role}，输出/功能类词条只有 ${attackCount} 条，偏少。建议至少 2 条以上输出向词条。` });
    } else {
      lines.push({ cls: 'good', text: `作为${h.role}，输出/功能类词条 ${attackCount} 条，结构合理。` });
    }
  }

  if (dilutableOwned.length > 0) {
    lines.push({ cls: 'info', text: `通用增伤：当前带了 ${dilutableOwned.join('、')}。收益稳定但容易被其他增伤渠道稀释，不用刻意堆，但也不亏。` });
  }

  const hasArmorPierce = allOwned.has('护甲穿透');
  const hasResistPierce = allOwned.has('抗性穿透');
  if (h.role === '战士' || h.role === '射手' || h.role === '法师') {
    if (h.damageType === '物理') {
      if (!hasArmorPierce) {
        lines.push({ cls: 'warn', text: `穿透：${name}是物理伤害，当前没有护甲穿透。打高护甲前排时可能打不动，建议至少补一条护甲穿透。` });
      } else {
        lines.push({ cls: 'good', text: `穿透：物理伤害，已有护甲穿透。` });
      }
    } else if (h.damageType === '能量') {
      if (!hasResistPierce) {
        lines.push({ cls: 'warn', text: `穿透：${name}是能量伤害，当前没有抗性穿透。打高抗性前排时可能打不动，建议至少补一条抗性穿透。` });
      } else {
        lines.push({ cls: 'good', text: `穿透：能量伤害，已有抗性穿透。` });
      }
    }
  }

  let html = `<div class="overview-grid">`;
  lines.forEach(l => {
    html += `<div class="conflict-line ${l.cls}">${l.text}</div>`;
  });
  html += `</div>`;

  const checks = calcThresholdChecks(name);
  if (checks.length > 0) {
    html += `<div class="label" style="margin-top:14px">阈值与溢出（仅统计装备+徽章贡献，不含英雄基础和其他来源）</div>`;
    checks.forEach(c => {
      html += `<div class="conflict-line ${c.cls}"><b>${c.stat}</b>：${c.note}</div>`;
    });
  } else {
    html += `<div class="tip info" style="margin-top:12px">当前配置里没有触发阈值的词条（暴击/命中/闪避/暴击抵抗/伤害减免）。</div>`;
  }

  box.innerHTML = html;
}

function analyzeSlotQuality(hero, itemType, slotKey, item, avgScore) {
  const h = HEROES[hero];
  const list = itemType === 'badge' ? h.badge : h.gear;
  const coreList = list.slice(0, 3);

  const sc = scoreItem(hero, item.stats, item.quality, item.part, itemType, item.base);
  const gap = avgScore - sc;

  const coreOnSlot = item.stats
    .map(s => ALIAS_MAP[s.name] || s.name)
    .filter(n => coreList.includes(n));

  const offStats = item.stats
    .map(s => ALIAS_MAP[s.name] || s.name)
    .filter(n => !list.includes(n));

  const data = getHeroData(hero);
  const slots = itemType === 'badge' ? data.badges : data.gears;
  const otherOwned = new Set();
  Object.keys(slots).forEach(k => {
    if (k === slotKey) return;
    slots[k].stats.forEach(s => otherOwned.add(ALIAS_MAP[s.name] || s.name));
  });
  const coreLostIfReplaced = coreOnSlot.filter(n => !otherOwned.has(n));
  const coreMissingOnSlot = coreList.filter(n => !coreOnSlot.includes(n));

  return { slot: slotKey, item, score: sc, gap, coreOnSlot, offStats, coreLostIfReplaced, coreMissingOnSlot };
}

function renderReplaceAdvice(name) {
  const box = document.getElementById('replaceBox');
  if (!box) return;
  const h = HEROES[name];
  const data = getHeroData(name);

  const items = [];

  const badgeSlots = Object.keys(data.badges);
  if (badgeSlots.length > 0) {
    const scores = badgeSlots.map(k => scoreItem(name, data.badges[k].stats, data.badges[k].quality, null, 'badge', data.badges[k].base));
    const avg = scores.reduce((a,b)=>a+b, 0) / scores.length;
    badgeSlots.forEach(k => {
      items.push({ type: 'badge', info: analyzeSlotQuality(name, 'badge', k, data.badges[k], avg) });
    });
  }

  const gearSlots = Object.keys(data.gears);
  const gearByPart = {};
  gearSlots.forEach(k => {
    const g = data.gears[k];
    if (!gearByPart[g.part]) gearByPart[g.part] = [];
    gearByPart[g.part].push(k);
  });
  Object.keys(gearByPart).forEach(part => {
    const keys = gearByPart[part];
    const scores = keys.map(k => scoreItem(name, data.gears[k].stats, data.gears[k].quality, data.gears[k].part, 'gear', data.gears[k].base));
    const avg = scores.reduce((a,b)=>a+b, 0) / scores.length;
    keys.forEach(k => {
      items.push({ type: 'gear', info: analyzeSlotQuality(name, 'gear', k, data.gears[k], avg) });
    });
  });

  if (items.length === 0) {
    box.innerHTML = `<div class="tip warn">还没有录入任何徽章或装备，先去上面添加。</div>`;
    return;
  }

  items.sort((a, b) => b.info.gap - a.info.gap);

  let html = '';
  const top = items.slice(0, 3);

  top.forEach((entry, idx) => {
    const { type, info } = entry;
    const item = info.item;
    const isPriority = idx === 0 && info.gap > 0;

    let suggestionStats = '';
    if (info.coreMissingOnSlot.length > 0) {
      suggestionStats = `建议换成带 <b>${info.coreMissingOnSlot.slice(0, 2).join('、')}</b> 的${type === 'badge' ? '徽章' : item.part}`;
    } else if (info.offStats.length > 0) {
      suggestionStats = `把 <b>${info.offStats.join('、')}</b> 换成更适配的词条`;
    } else {
      suggestionStats = `词条本身没问题，问题在基础属性偏低，找同部位更高数值的替换`;
    }

    const title = type === 'badge'
      ? `徽章 槽 ${info.slot}`
      : `装备 槽 ${info.slot}（${item.part}）`;

    const tag = isPriority
      ? `<span class="rc-tag" style="background:#5a3a1a;color:#f0c88a;border:1px solid #8a5a2a">优先换</span>`
      : (info.gap > 0 ? `<span class="rc-tag">可以换</span>` : `<span class="rc-tag" style="color:#7ee2a8">暂时够用</span>`);

    html += `<div class="replace-card ${isPriority ? 'priority' : ''}">
      <div class="rc-head">
        <span class="rc-title">${title}</span>
        <span class="rc-score">${info.score.toFixed(2)} 分</span>
      </div>
      <div class="rc-body">
        ${tag}
        当前词条：${item.stats.map(statLabel).join('、') || '（无）'}<br>
        ${baseLine(type, item.part, item.base)}
        <div style="margin-top:6px">${suggestionStats}。</div>
        ${info.coreLostIfReplaced.length > 0 ? `<div style="color:#e2d47e;margin-top:4px">⚠️ 换掉会丢核心词条：${info.coreLostIfReplaced.join('、')}，其他地方没覆盖。</div>` : ''}
      </div>
    </div>`;
  });

  const worst = top[0];
  let conclusion;
  if (worst.info.gap <= 0) {
    conclusion = `当前配置整体比较均衡，没有明显拖后腿的槽位。`;
  } else {
    conclusion = `优先换 <b>${worst.type === 'badge' ? '徽章' : '装备'} 槽 ${worst.info.slot}</b>${worst.type === 'gear' ? `（${worst.info.item.part}）` : ''}，它比同部位平均分低 ${worst.info.gap.toFixed(2)} 分。`;
    if (worst.info.coreMissingOnSlot.length > 0) {
      conclusion += `换上后建议带 <b>${worst.info.coreMissingOnSlot.slice(0, 2).join('、')}</b>。`;
    }
  }

  html += `<div class="tip suggest" style="margin-top:12px">${conclusion}</div>`;

  box.innerHTML = html;
}

/* ============ 分支式分析 ============ */

function tieBreak(hero, itemType, part, a, b) {
  const list = itemType === 'badge' ? HEROES[hero].badge : HEROES[hero].gear;

  function statRankScore(item) {
    let sum = 0;
    item.stats.forEach(s => {
      const idx = list.indexOf(s.name);
      if (idx >= 0) sum += (list.length - idx);
    });
    return sum;
  }
  const aStat = statRankScore(a);
  const bStat = statRankScore(b);
  if (aStat !== bStat) return aStat > bStat ? 'a' : 'b';

  const aBase = scoreBase(hero, itemType, part, a.base);
  const bBase = scoreBase(hero, itemType, part, b.base);
  if (Math.abs(aBase - bBase) > 0.001) return aBase > bBase ? 'a' : 'b';

  if (a.quality !== b.quality) return a.quality > b.quality ? 'a' : 'b';

  return 'tie';
}

function buildFlexibleAnalysis(hero, itemType, newStats, newQ, newPart, newBase, oldItem, oldSlot) {
  const h = HEROES[hero];
  const heroList = itemType === 'badge' ? h.badge : h.gear;
  const oldPart = oldItem.part || null;

  const newStatScore = scoreStats(hero, newStats, newQ, newPart, itemType);
  const newBaseScore = scoreBase(hero, itemType, newPart, newBase);
  const oldStatScore = scoreStats(hero, oldItem.stats, oldItem.quality, oldPart, itemType);
  const oldBaseScore = scoreBase(hero, itemType, oldPart, oldItem.base || {});

  const statGain = newStatScore - oldStatScore;
  const baseGain = newBaseScore - oldBaseScore;
  const totalGain = statGain + baseGain;

  const partMismatch = itemType === 'gear' && oldPart && newPart && oldPart !== newPart;

  const baseRatio = (() => {
    if (oldBaseScore <= 0) return newBaseScore > 0 ? 99 : 1;
    return newBaseScore / oldBaseScore;
  })();

  const oldNames = new Set(oldItem.stats.map(s => ALIAS_MAP[s.name] || s.name));
  const newNames = new Set(newStats.map(s => ALIAS_MAP[s.name] || s.name));
  const lostCore = [];
  const lostDilutable = [];
  oldItem.stats.forEach(s => {
    const n = ALIAS_MAP[s.name] || s.name;
    if (newNames.has(n)) return;
    const idx = heroList.indexOf(n);
    if (idx >= 0 && idx <= 2) lostCore.push({ name: n, rank: idx + 1 });
    if (isDilutable(n)) lostDilutable.push(n);
  });
  const gainedCore = [];
  const gainedOff = [];
  newStats.forEach(s => {
    const n = ALIAS_MAP[s.name] || s.name;
    const idx = heroList.indexOf(n);
    if (idx >= 0 && idx <= 2) gainedCore.push({ name: n, rank: idx + 1 });
    if (idx < 0) gainedOff.push(n);
  });

  const thresholdWarnings = analyzeThresholdShift(hero, oldItem, newStats);

  const lines = [];

  if (partMismatch) {
    lines.push({ cls: 'bad', text: `❌ 部位不匹配：当前槽是 ${oldPart}，新物品是 ${newPart}。装备只能放在同部位，这件换不上去。` });
    return { lines, verdict: `不能换：部位不一致`, verdictClass: 'keep' };
  }

  const newAllDilutable = newStats.length > 0 && newStats.every(s => isDilutable(s.name));
  const oldAllDilutable = oldItem.stats.length > 0 && oldItem.stats.every(s => isDilutable(s.name));
  if (newAllDilutable && oldAllDilutable && Math.abs(totalGain) < 1) {
    lines.push({ cls: 'info', text: `两边都是通用增伤词条，收益都被稀释，换不换基本没区别。建议把资源留给带攻击/穿透/暴击的装备。` });
    return { lines, verdict: `不建议换：都是易稀释词条`, verdictClass: 'keep' };
  }

  if (baseRatio >= 3 || baseRatio <= 1/3) {
    if (baseRatio >= 3) {
      lines.push({ cls: 'good', text: `✅ 基础属性碾压：新物品基础分是当前的 <b>${baseRatio.toFixed(1)} 倍</b>，词条差距根本不用看，直接换。` });
    } else {
      lines.push({ cls: 'bad', text: `❌ 基础属性被碾压：新物品基础分只有当前的 <b>${(baseRatio*100).toFixed(0)}%</b>，词条再好也补不回来，别换。` });
    }
    return {
      lines,
      verdict: baseRatio >= 3 ? `建议换到槽 ${oldSlot}（基础属性碾压）` : `不建议换，保留槽 ${oldSlot}（基础属性差太多）`,
      verdictClass: baseRatio >= 3 ? 'swap' : 'keep'
    };
  }

  if (Math.abs(statGain) >= 2 && Math.abs(baseGain) < Math.abs(statGain) * 0.5) {
    if (statGain > 0) {
      lines.push({ cls: 'good', text: `✅ 词条碾压：新物品词条分比当前高 <b>${statGain.toFixed(2)}</b>，基础属性差距不大，词条优势直接决定换。` });
    } else {
      lines.push({ cls: 'bad', text: `❌ 词条被碾压：新物品词条分比当前低 <b>${Math.abs(statGain).toFixed(2)}</b>，基础属性补不回来。` });
    }
    if (gainedCore.length > 0) {
      lines.push({ cls: 'good', text: `新物品带的核心词条：${gainedCore.map(g => `【${g.name}】(第${g.rank}优先)`).join('、')}。` });
    }
    return {
      lines,
      verdict: statGain > 0 ? `建议换到槽 ${oldSlot}（词条碾压）` : `不建议换，保留槽 ${oldSlot}（词条差太多）`,
      verdictClass: statGain > 0 ? 'swap' : 'keep'
    };
  }

  if (gainedOff.length > 0 && gainedCore.length === 0 && newStats.every(s => !heroList.includes(ALIAS_MAP[s.name] || s.name))) {
    lines.push({ cls: 'bad', text: `❌ 词条完全错位：新物品的词条 ${gainedOff.map(n => `【${n}】`).join('、')} 全部不在${hero}的推荐列表里，这件对他没用。` });
    return { lines, verdict: `不建议换：词条和英雄不搭`, verdictClass: 'keep' };
  }

  if (lostCore.length > 0 && gainedCore.length > 0 && Math.abs(totalGain) <= 2) {
    lines.push({ cls: 'warn', text: `换掉槽 ${oldSlot} 会丢核心词条：${lostCore.map(l => `【${l.name}】(第${l.rank}优先)`).join('、')}。` });
    lines.push({ cls: 'good', text: `新物品补上核心词条：${gainedCore.map(g => `【${g.name}】(第${g.rank}优先)`).join('、')}。` });
    lines.push({ cls: 'info', text: `属于一换一，换不换取决于你更需要哪个方向。` });
  } else {
    if (Math.abs(statGain) < 0.5 && Math.abs(baseGain) < 0.5) {
      lines.push({ cls: 'info', text: `词条和基础属性都基本持平（词条 ${statGain >= 0 ? '+' : ''}${statGain.toFixed(2)}，基础 ${baseGain >= 0 ? '+' : ''}${baseGain.toFixed(2)}），换不换没区别，留着当备胎。` });
    } else if (Math.abs(statGain) < 0.5 && baseGain > 0.5) {
      lines.push({ cls: 'good', text: `词条持平，基础属性更高（+${baseGain.toFixed(2)}），可以换。` });
    } else if (Math.abs(statGain) < 0.5 && baseGain < -0.5) {
      lines.push({ cls: 'bad', text: `词条持平，基础属性更低（${baseGain.toFixed(2)}），不值得换。` });
    } else if (statGain > 0.5 && baseGain < -0.5) {
      lines.push({ cls: 'info', text: `词条更好（+${statGain.toFixed(2)}），基础属性略低（${baseGain.toFixed(2)}），看你的实际需求。` });
    } else if (statGain < -0.5 && baseGain > 0.5) {
      lines.push({ cls: 'warn', text: `基础属性更高（+${baseGain.toFixed(2)}），但词条更差（${statGain.toFixed(2)}）。属于基础撑分、词条吃亏的类型，看你缺不缺基础。` });
    } else if (statGain > 0.5 && baseGain > 0.5) {
      lines.push({ cls: 'good', text: `词条和基础属性都更好（词条 +${statGain.toFixed(2)}，基础 +${baseGain.toFixed(2)}），放心换。` });
    } else {
      lines.push({ cls: 'info', text: `词条 ${statGain >= 0 ? '+' : ''}${statGain.toFixed(2)}，基础 ${baseGain >= 0 ? '+' : ''}${baseGain.toFixed(2)}，综合算下来${totalGain > 0 ? '略优' : '略差'}。` });
    }

    if (lostCore.length > 0) {
      lines.push({ cls: 'warn', text: `⚠️ 换掉会丢核心词条：${lostCore.map(l => `【${l.name}】(第${l.rank}优先)`).join('、')}。` });
    }
    if (lostDilutable.length > 0) {
      lines.push({ cls: 'info', text: `换掉会丢通用增伤：${lostDilutable.join('、')}，损失可控。` });
    }
    if (gainedCore.length > 0) {
      lines.push({ cls: 'good', text: `新物品带核心词条：${gainedCore.map(g => `【${g.name}】`).join('、')}。` });
    }
    if (gainedOff.length > 0) {
      lines.push({ cls: 'warn', text: `新物品带优先级外的词条：${gainedOff.join('、')}，收益有限。` });
    }
  }

  const newDilutable = newStats.filter(s => isDilutable(s.name));
  if (newDilutable.length > 0) {
    lines.push({ cls: 'info', text: `新物品带通用增伤：${newDilutable.map(s => `【${s.name}】`).join('、')}，对物理和能量都生效，不是虚战，但优先级低于攻击和穿透。` });
  }

  thresholdWarnings.forEach(w => {
    lines.push({ cls: 'warn', text: `⚠️ ${w}` });
  });

  let verdict, verdictClass;
  if (totalGain > 0.5) { verdict = `建议换到槽 ${oldSlot}`; verdictClass = 'swap'; }
  else if (totalGain < -0.5) { verdict = `不建议换，保留槽 ${oldSlot}`; verdictClass = 'keep'; }
  else {
    const who = tieBreak(hero, itemType, itemType === 'gear' ? (newPart || oldPart) : null,
      { stats: newStats, quality: newQ, base: newBase },
      { stats: oldItem.stats, quality: oldItem.quality, base: oldItem.base });
    if (who === 'a') { verdict = `基本同分，新物品略优`; verdictClass = 'swap'; }
    else if (who === 'b') { verdict = `基本同分，当前略优，建议保留`; verdictClass = 'keep'; }
    else { verdict = `基本同分，两者等价`; verdictClass = 'tie'; }
  }

  return { lines, verdict, verdictClass };
}

function analyzeThresholdShift(hero, oldItem, newStats) {
  const oldTotals = calcStatTotals(hero);
  const newTotals = {};
  Object.keys(oldTotals).forEach(k => newTotals[k] = oldTotals[k]);

  oldItem.stats.forEach(s => {
    const n = ALIAS_MAP[s.name] || s.name;
    newTotals[n] = (newTotals[n] || 0) - (s.pct || 0);
  });
  newStats.forEach(s => {
    const n = ALIAS_MAP[s.name] || s.name;
    newTotals[n] = (newTotals[n] || 0) + (s.pct || 0);
  });

  const warnings = [];
  Object.keys(STAT_THRESHOLDS).forEach(statName => {
    const t = STAT_THRESHOLDS[statName];
    const oldV = oldTotals[statName] || 0;
    const newV = newTotals[statName] || 0;
    if (newV > oldV && newV >= t.cap && oldV < t.cap) {
      warnings.push(`${statName} 会从 ${oldV.toFixed(2)}% 推到 ${newV.toFixed(2)}%，超过 ${t.cap}% 阈值。${t.note}。`);
    } else if (newV > oldV && newV >= t.warn && oldV < t.warn) {
      warnings.push(`${statName} 会从 ${oldV.toFixed(2)}% 推到 ${newV.toFixed(2)}%，进入 ${t.warn}% 的注意区间。${t.note}。`);
    }
  });
  return warnings;
}

function renderTeamConflict(heroes) {
  if (!heroes || heroes.length === 0) return '';

  const statUsers = {};
  heroes.forEach(h => {
    const hero = HEROES[h];
    if (!hero) return;
    const core = [...new Set([...hero.badge.slice(0, 3), ...hero.gear.slice(0, 3)])];
    core.forEach(s => {
      if (!statUsers[s]) statUsers[s] = [];
      statUsers[s].push(h);
    });
  });

  const conflicts = Object.keys(statUsers).filter(s => statUsers[s].length >= 2);
  const uniqueNeeds = Object.keys(statUsers).filter(s => statUsers[s].length === 1);

  let html = `<div class="analysis">
    <h4>📋 词条冲突提醒</h4>`;

  if (conflicts.length === 0) {
    html += `<div class="line good">✅ 这 5 个英雄的核心词条没有明显冲突，资源分配压力小。</div>`;
  } else {
    conflicts.forEach(s => {
      const users = statUsers[s];
      let priority = '';
      if (s === '攻击速度') priority = '优先给普攻型主C（兰博/小丑杰克/铁肘老大），技能型英雄先不抢。';
      else if (s === '暴击') priority = '优先给爆发输出（铁腿红魔/小丑杰克/雷教授），坦克先不抢。';
      else if (s === '技能强度') priority = '优先给能量技能型主C和辅助（鬼火杰森/雷教授/巫师老侃），物理输出先不抢。';
      else if (s === '攻击') priority = '优先给物理输出（铁腿红魔/兰博/小丑杰克），能量输出先不抢。';
      else if (s === '生命') priority = '前排优先，输出位最后补。';
      else if (s === '伤害减免') priority = '前排优先，输出位最后补。';
      else if (s === '护甲穿透') priority = '优先给物理输出（铁腿红魔/铁肘老大），能量英雄先不抢。';
      else if (s === '抗性穿透') priority = '优先给能量输出（鬼火杰森/雷教授/永生老乔），物理输出先不抢。';
      else priority = '按英雄定位分配，主C优先。';

      html += `<div class="line warn">⚠️ <b>${s}</b>：${users.join('、')} 都要。${priority}</div>`;
    });
  }

  if (uniqueNeeds.length > 0) {
    html += `<div class="line info">独占需求：${uniqueNeeds.join('、')}，这些词条只有一个人要，资源不冲突。</div>`;
  }

  html += `<div class="conclusion tie">资源有限时，先满足冲突词条里的主C，再补辅助和坦克。</div></div>`;
  return html;
}

  html += `</div></div>`;

  html += `<div class="analysis">

  Object.keys(roles).forEach(r => {
    html += `<div class="line ${roles[r] > 0 ? 'good' : 'warn'}">${r}：${roles[r]} 个</div>`;
  });

  const lines = [];

  if (roles["坦克"] >= 1) lines.push({ cls: 'good', text: '✅ 有坦克，前排有承伤。' });
  if (roles["射手"] === 0 && roles["战士"] === 0 && roles["法师"] === 0) lines.push({ cls: 'bad', text: '⚠️ 没有输出，打不动人。' });
  if (roles["法师"] === 0) lines.push({ cls: 'warn', text: '⚠️ 没有法师/辅助，缺增伤和控制。' });
  if (roles["坦克"] >= 3) lines.push({ cls: 'warn', text: '⚠️ 坦克过多（3+），输出可能不足。' });
  if (roles["射手"] + roles["战士"] + roles["法师"] >= 4) lines.push({ cls: 'good', text: '✅ 输出/辅助充足。' });

  lines.forEach(l => { html += `<div class="line ${l.cls}">${l.text}</div>`; });

  html += `<div class="conclusion ${roles["坦克"] === 0 ? 'keep' : 'swap'}">${roles["坦克"] === 0 ? '建议补 1 个坦克再上阵' : '阵容基本完整，可上阵'}</div></div>`;

  if (roles["坦克"] === 0) {
    html += `<div class="tip suggest"><b>推荐补坦克：</b>`;
    ["大嘴山姆", "机器屠夫", "不死州长", "巨石绿魔"].forEach(t => {
      html += `<span class="val first">${t}</span> `;
    });
    html += `</div>`;
  }

  html += renderTeamConflict(freeSelected);

  box.innerHTML = html;
}

function doExport() {
  const area = document.getElementById('exportArea');
  try {
    area.value = JSON.stringify(CONFIG);
  } catch(e) {
    area.value = '导出失败：' + e.message;
  }
}

function copyExport() {
  const area = document.getElementById('exportArea');
  if (!area.value) { alert('请先生成备份文字'); return; }
  area.select();
  area.setSelectionRange(0, 999999);
  try {
    document.execCommand('copy');
    alert('已复制，粘贴到微信/备忘录/电脑保存即可。');
  } catch(e) {
    alert('复制失败，请手动全选复制。');
  }
}

function doImport() {
  const area = document.getElementById('importArea');
  const txt = area.value.trim();
  if (!txt) { alert('请先粘贴备份文字'); return; }
  let parsed;
  try {
    parsed = JSON.parse(txt);
  } catch(e) {
    alert('备份文字格式不对，无法解析。请确认完整复制了备份文字。');
    return;
  }
  if (!parsed || typeof parsed !== 'object') {
    alert('备份内容不是有效的数据对象。');
    return;
  }
  if (!confirm('导入会覆盖当前手机上的所有配置数据，确定继续吗？')) return;

  CONFIG = parsed;
  saveConfig(CONFIG);
  alert('导入成功，正在刷新页面...');
  location.reload();
}

function switchTab(panelId) {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
  const tab = document.querySelector(`.tab[data-panel="${panelId}"]`);
  if (tab) tab.classList.add('active');
  const panel = document.getElementById(panelId);
  if (panel) panel.classList.add('active');
}

document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    switchTab(t.dataset.panel);
  };
});
